esphome:
  name: heizungstechnik
  friendly_name: heizungstechnik
  build_path: "C:/tmp/esphome/heizungstechnik"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: INFO
  hardware_uart: USB_CDC

# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret ota_password

substitutions:
  entity_room_temperature: "sensor.durchschnittstemperatur_haus_ohne_keller"
  entity_humidity: "sensor.durchschnitt_luftfeuchtigkeit_haus"
  timezone: "Europe/Berlin"

#########################################
#                                       #
#   CAN configuration                   #
#                                       #
#########################################
canbus:
  - id: !extend wp_can
    platform: esp32_can
    tx_pin: GPIO44
    rx_pin: GPIO43
    bit_rate: 20kbps
    rx_queue_len: 512  # Default: 8, increased for high-traffic CAN bus
    tx_queue_len: 64   # Default: 16, increased for burst writes

#########################################
#                                       #
#   Buttons                             #
#                                       #
#########################################
button:
  - platform: restart
    name: "Restart ESP32-PoE Technik"

#########################################
#                                       #
#   WiFi Configuration                  #
#                                       #
#########################################
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "CrowPanel Fallback Hotspot"
    password: !secret fallback_password

#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################
packages:
  display: !include ./yaml/display.yaml
  ttf07:    !include ./yaml/ttf07.yaml
