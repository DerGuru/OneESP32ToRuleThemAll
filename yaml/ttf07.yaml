#########################################
#                                       #
#   ESPHome                             #
#                                       #
#########################################
esphome:
  platformio_options:
    build_flags:
      - "-DTTF_07_C"
  on_boot:
    priority: 100.0 # AFTER_CONNECTION
    then:
      - lambda: |-
          CallbackHandler::instance().addCallback(std::make_pair(Kessel,Property::kPROGRAMMSCHALTER),[](const SimpleVariant& value){
            const auto stringValue{value.get<std::string>()};
            const auto index = id(PROGRAMMSCHALTER).index_of(stringValue);
            if(index.has_value()) {
              id(PROGRAMMSCHALTER).publish_state(stringValue);
            }
          });
          queueRequest(Kessel, Property::kPROGRAMMSCHALTER);

          CallbackHandler::instance().addCallback(std::make_pair(Kessel,Property::kBETRIEBS_STATUS),[](const SimpleVariant& value){
            const std::bitset<15U> status_bits{static_cast<std::uint16_t>(value)};
            id(NHZ1).publish_state(status_bits.test(0) && !status_bits.test(1U));
            id(NHZ2).publish_state(!status_bits.test(0) && status_bits.test(1U));
            id(NHZ3).publish_state(status_bits.test(0) && status_bits.test(1U));
            // 2U is unknown
            id(VERDICHTER).publish_state(status_bits.test(3U));
            id(WARMWASSERBEREITUNG).publish_state(status_bits.test(4U));
            //id(HEIZKREISPUMPE).publish_state(status_bits.test(5U));
            //id(PUFFERLADEPUMPE).publish_state(status_bits.test(6U));
            // 7U is unknown
            //id(QUELLENPUMPE).publish_state(status_bits.test(8U));
            id(KUEHLBETRIEB).publish_state(status_bits.test(9U));
            // 10 to 15 are unknown
          });

          CallbackHandler::instance().addCallback(std::make_pair(Kessel,Property::kSOMMERBETRIEB),[](const SimpleVariant& value){
            id(SOMMERBETRIEB).publish_state(value.get<bool>());
          });
          queueRequest(Kessel, Property::kSOMMERBETRIEB);

          // VORLAUFISTTEMP: dual callback for Kessel AND HK1 (Kessel responds to directed requests,
          // HK1 may broadcast the value independently)
          auto vorlauf_cb = [](const SimpleVariant& value){
            id(VORLAUFISTTEMP).publish_state(value);
          };
          CallbackHandler::instance().addCallback(std::make_pair(Kessel,Property::kVORLAUFISTTEMP), vorlauf_cb);
          CallbackHandler::instance().addCallback(std::make_pair(HK1,Property::kVORLAUFISTTEMP), vorlauf_cb);
          queueRequest(Kessel, Property::kVORLAUFISTTEMP);

          // SPEICHERSOLLTEMP: only listen on Kessel (WPM2 sends garbled data after write)
          CallbackHandler::instance().addCallback(std::make_pair(Kessel,Property::kSPEICHERSOLLTEMP),[](const SimpleVariant& value){
            id(SPEICHERSOLLTEMP).publish_state(value);
          });
          queueRequest(Kessel, Property::kSPEICHERSOLLTEMP);

          // STEIGUNG_HK1: listen on HK1 + Manager
          CallbackHandler::instance().addCallbacks({std::make_pair(HK1,Property::kSTEIGUNG_HK1),
                                                    std::make_pair(Manager,Property::kSTEIGUNG_HK1)},[](const SimpleVariant& value){
            id(STEIGUNG_HK1).publish_state(value);
          });
          queueRequest(HK1, Property::kSTEIGUNG_HK1);

#########################################
#                                       #
#   Selects                             #
#                                       #
#########################################
select:
  - platform: template
    name: "PROGRAMMSCHALTER"
    id: PROGRAMMSCHALTER
    options:
      - "Notbetrieb"
      - "Bereitschaft"
      - "Programm"
      - "Komfort"
      - "Eco"
      - "Warmwasser"
      - "Unbekannt"
    initial_option: "Unbekannt"
    optimistic: true
    setup_priority: 100
    set_action:
      then:
        - lambda: |-
            const auto betriebsartId = Mapper::instance().getBetriebsartId(x);
            if(betriebsartId.has_value()) {
              // Write to real Manager address 0x480 (integrated WPM in heat pump)
              // Reference: ha-stiebel-control sends PROGRAMMSCHALTER to cm_manager (0x480) as PC (0x680)
              static constexpr CanMember WPM{0x480, "WPM"};
              const auto [IdByte1, IdByte2] = asBytes(WPM.getWriteId());
              const auto [IndexByte1, IndexByte2] = asBytes(Property::kPROGRAMMSCHALTER.id);
              const auto [ValueByte1, ValueByte2] = asBytes(betriebsartId.value());
              std::vector<std::uint8_t> data{IdByte1, IdByte2, 0xfa, IndexByte1, IndexByte2, ValueByte1, ValueByte2};
              ESP_LOGI("ttf07.yaml:select", "Updating PROGRAMMSCHALTER to %s betriebsartId=0x%0x -> WPM(0x480)", x.c_str(), betriebsartId.value());
              id(wp_can).send_data(ESPClient.canId, false, data);
              scheduleRequest(Kessel, Property::kPROGRAMMSCHALTER, std::chrono::seconds(10));
            }

