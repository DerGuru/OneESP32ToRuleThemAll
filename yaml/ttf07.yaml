    icon: "mdi:thermometer-lines"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    update_interval: $interval_medium
    lambda: |-
        queueRequest(Kessel, Property::kVORLAUFISTTEMP);
        return {};
