#########################################
#                                       #
#   SPEICHERSOLLTEMP (custom number)    #
#   Read from Kessel, write to WPM2    #
#                                       #
#########################################
number:
  - platform: template
    name: SPEICHERSOLLTEMP
    id: SPEICHERSOLLTEMP
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    min_value: 35
    max_value: 60
    step: 1
    mode: slider
    initial_value: NAN
    optimistic: true
    set_action:
      - lambda: |-
          ESP_LOGI("Number", "Setting new value %f for SPEICHERSOLLTEMP", x);
          if(x != NAN) {
            const auto type = Property::kSPEICHERSOLLTEMP.type;
            const auto value = GetRawByType(SimpleVariant(x), type);
            if(value.has_value()) {
                queueTransmission(WPM2, Property::kSPEICHERSOLLTEMP, *value);
                scheduleRequest(Kessel, Property::kSPEICHERSOLLTEMP, std::chrono::seconds(10));
            } else {
              ESP_LOGE("Number", "Setting new value for SPEICHERSOLLTEMP failed!");
            }
          }

  - platform: template
    name: Heizkurve
    id: STEIGUNG_HK1
    icon: "mdi:sine-wave"
    unit_of_measurement: ""
    min_value: 0.1
    max_value: 1.5
    step: 0.05
    mode: slider
    initial_value: NAN
    optimistic: true
    set_action:
      - lambda: |-
          ESP_LOGI("Number", "Setting new value %f for STEIGUNG_HK1", x);
          if(x != NAN) {
            const auto type = Property::kSTEIGUNG_HK1.type;
            const auto value = GetRawByType(SimpleVariant(x), type);
            if(value.has_value()) {
                queueTransmission(HK1, Property::kSTEIGUNG_HK1, *value);
            } else {
              ESP_LOGE("Number", "Setting new value for STEIGUNG_HK1 failed!");
            }
          }
